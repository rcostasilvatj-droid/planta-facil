<style>
*{box-sizing:border-box}
#splash{position:fixed;inset:0;z-index:20;background:#021429;display:flex;align-items:center;justify-content:center;transition:opacity .45s}#splash img{max-width:100%;max-height:100%;object-fit:contain}#splash.hide{opacity:0;pointer-events:none}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f2328;background:#f4f3ef}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:#fff;border-bottom:1px solid #ddd}
header .grp{display:flex;gap:4px;flex-wrap:wrap;padding-right:8px;margin-right:4px;border-right:1px solid #e5e5e5}
header .grp:last-child{border-right:0}
button{font:inherit;font-size:14px;padding:7px 11px;border:1px solid #cfcfcf;background:#fff;border-radius:8px;cursor:pointer;color:#1f2328}
button:hover{background:#f2f2f2}

button.danger{color:#b42318;border-color:#f1b5ae}
main{flex:1;display:flex;min-height:0}
#wrap{flex:1;position:relative;min-width:0;background:#fff}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#alerta{position:absolute;left:8px;right:8px;top:8px;z-index:3;display:none;background:#b42318;color:#fff;border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
#andar{position:absolute;top:8px;right:8px;z-index:2;display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.95);border:1px solid #ddd;border-radius:8px;padding:4px 6px;font-size:13px;color:#555}
#andar button{padding:4px 9px;font-size:13px}
#hint{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border:1px solid #ddd;border-radius:8px;padding:6px 10px;font-size:13px;color:#555;max-width:calc(100% - 20px)}
aside{width:290px;padding:14px;overflow:auto;background:#fafaf8;border-left:1px solid #ddd;font-size:14px}
aside h3{font-size:15px;margin:4px 0 10px;font-weight:600}
aside label{display:block;margin:10px 0 4px;color:#555;font-size:13px}
aside input,aside select{width:100%;font:inherit;padding:7px 9px;border:1px solid #ccc;border-radius:8px;background:#fff}
aside .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
aside .muted{color:#666;font-size:13px;line-height:1.5}
aside ul{padding-left:18px;margin:6px 0}
.sum{background:#fff;border:1px solid #e3e3e3;border-radius:8px;padding:8px 10px;line-height:1.7}

#modal .box{background:#fff;border-radius:12px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:16px}
#modal img{max-width:100%;border:1px solid #ddd}
#modal textarea{width:100%;height:220px;font-family:monospace;font-size:12px}
header button .ic{margin-right:5px}
#bMore{display:none}
@media (max-width:760px){
  main{flex-direction:column}
  aside{width:auto;border-left:0;border-top:1px solid #ddd;max-height:32vh;padding:10px 14px}
  #wrap{min-height:62vh} /* o desenho fica com a maior parte da tela; o painel usa o que sobra e rola */
  /* Menu compacto do celular: duas fileiras de botões (ícone em cima, nome embaixo); o resto fica no menu "Mais". */
  header{position:relative;gap:4px;padding:5px 6px}
  header .grp{display:contents}
  header .brk{flex-basis:100%;height:0}
  header button{flex:1 1 auto;min-width:40px;min-height:44px;padding:3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.15;white-space:nowrap}
  header button .ic{margin:0 0 1px;font-size:17px;line-height:1.2}
  #bMore{display:flex}
  #fType{display:none;order:9;flex:1 1 100%;min-height:40px}
  header.furn #fType{display:block}
  header .grp.more{display:none;position:absolute;top:100%;right:6px;z-index:4;flex-direction:column;gap:6px;padding:8px;min-width:220px;margin-top:2px;background:#fff;border:1px solid #ccc;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  header.open .grp.more{display:flex}
  header .grp.more button{flex:none;flex-direction:row;justify-content:flex-start;font-size:15px;padding:8px 12px}
  header .grp.more button .ic{margin:0 8px 0 0}
  header .grp.more #saveSt{padding:4px 6px!important}
  #hint{font-size:12px;padding:4px 8px;left:6px;bottom:6px;max-width:calc(100% - 12px)}
}

<body>
<div id="splash"><img src="splash.webp" alt="Planta Fácil — carregando"></div>
<header>
  <div class="grp">
    <button data-mode="select" class="on" title="Selecionar, mover e arrastar (V)"><span class="ic">↖</span><span class="tx">Selecionar</span></button>
    <button data-mode="wall" title="Desenhar parede: clique e arraste (P)"><span class="ic">▭</span><span class="tx">Parede</span></button>
    <button data-mode="door" title="Clique numa parede para pôr uma porta"><span class="ic">🚪</span><span class="tx">Porta</span></button>

</header>
<main>
  <div id="wrap"><svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg><div id="v3d" style="position:absolute;inset:0;display:none;touch-action:none;background:#eef1f4"></div><div id="hint"></div><div id="andar" title="Escolha qual andar você está desenhando"><span>Andar:</span><button id="bLaje">⬆ Laje</button><button id="bTerreo">⬇ Térreo</button></div><div id="alerta" role="alert" title="Toque para fechar"></div></div>
  <aside id="panel"></aside>
</main>
<div id="modal"><div class="box" id="mbox"></div></div>
<input type="file" id="file" accept=".json,application/json,text/plain" style="display:none">
<input type="file" id="fileBg" accept="image/*" style="display:none">

<script>
"use strict";
const KEY = 'planta-laje-ricardo-v1';
const svg = document.getElementById('cv'), wrap = document.getElementById('wrap');
const panel = document.getElementById('panel'), hint = document.getElementById('hint'), header = document.querySelector('header');

const FURN = {
  mesa: { nome: 'Mesa com computador', w: 1.4, d: 0.6 },
  cadeira: { nome: 'Cadeira de escritório', w: 0.6, d: 0.6 },
  sofa: { nome: 'Sofá', w: 2.0, d: 0.85 },
  tv: { nome: 'Rack com TV', w: 1.6, d: 0.4 },
  estante: { nome: 'Estante', w: 0.8, d: 0.35 },
  planta: { nome: 'Vaso de planta', w: 0.4, d: 0.4 }
};
function furnDef() {
  return [
    { id: 101, type: 'mesa', x: 2.0, y: 0.4, w: 1.4, d: 0.6, rot: 0 },
    { id: 102, type: 'cadeira', x: 2.0, y: 1.05, w: 0.6, d: 0.6, rot: 180 },
    { id: 103, type: 'estante', x: 0.55, y: 0.25, w: 0.8, d: 0.35, rot: 0 },
    { id: 104, type: 'tv', x: 0.28, y: 4.2, w: 1.6, d: 0.4, rot: 270 },
    { id: 105, type: 'sofa', x: 3.5, y: 4.2, w: 2.0, d: 0.85, rot: 90 },
    { id: 106, type: 'planta', x: 0.4, y: 7.0, w: 0.4, d: 0.4, rot: 0 }
  ];
}
// pBloco, pCim e pAreia são os preços do orçamento, em reais (0 = ainda não informado).
// Projetos antigos recebem esses campos com 0 pelo norm(), que completa S.mat a partir daqui.
function matDef() { return { tipo: '9x19x19', bw: 19, bh: 19, bt: 9, j: 1, perda: 10, trAss: 6, reboco: true, faces: 2, rebEsp: 2, trReb: 6, perdaArg: 15, pBloco: 0, pCim: 0, pAreia: 0 }; }
// Imagem de fundo: S.fundo guarda só os ajustes (posição, largura em metros, proporção, opacidade).
// A imagem em si fica numa chave separada do localStorage (KEY + '-fundo'), junto com um id.
// Ela só aparece se o id for o mesmo de S.fundo.id. Assim a imagem não pesa nos backups nem no
// desfazer, e um projeto aberto de outro aparelho não mostra a imagem de outro projeto.
function fundoDef() { return { id: null, on: true, x: 0, y: 0, w: 10, ar: 1, op: 0.5 }; }
// Acabamento do 3D: cor e textura das paredes e do piso. O padrão é "liso" com as cores de antes,
// então projetos antigos aparecem iguais. As texturas são desenhadas pelo próprio app (sem arquivos de imagem).
const TEX_PAREDE = { liso: 'Liso (pintura)', reboco: 'Reboco / textura', tijolo: 'Tijolo aparente', azulejo: 'Azulejo 15x15' };
const TEX_PISO = { liso: 'Liso', ceramica: 'Cerâmica 60x60', madeira: 'Madeira (tábuas)', cimento: 'Cimento queimado' };
function acabDef() { return { parede: '#efe9de', paredeTex: 'liso', piso: '#e2c99a', pisoTex: 'liso' }; }
// Confere os valores (um projeto importado pode trazer qualquer texto): cor só no formato #rrggbb e textura só da lista.
function acabNorm(a) {
  const d = acabDef(), r = Object.assign(acabDef(), a || {}), cor = c => /^#[0-9a-f]{6}$/i.test(c);
  if (!cor(r.parede)) r.parede = d.parede; if (!cor(r.piso)) r.piso = d.piso;
  if (!TEX_PAREDE[r.paredeTex]) r.paredeTex = 'liso'; if (!TEX_PISO[r.pisoTex]) r.pisoTex = 'liso';
  return { parede: r.parede, paredeTex: r.paredeTex, piso: r.piso, pisoTex: r.pisoTex };
}
function norm(x) {
  const d = modelo();
  ['wallH', 'lajeH', 'showDown', 'dims'].forEach(k => { if (x[k] === undefined) x[k] = d[k]; });
  x.stairs = x.stairs || []; x.ops = x.ops || []; x.next = x.next || 1000;
  x.mat = Object.assign(matDef(), x.mat || {});
  if (!x.furn) x.furn = furnDef();
  x.varanda = Object.assign({ on: true, d: 1.5, gc: true, gcH: 1.0 }, x.varanda || {});
  x.roof = Object.assign({ on: true, plat: 0.9, caim: 10, dir: 'frente' }, x.roof || {});
  x.fundo = Object.assign(fundoDef(), x.fundo || {});
  x.acab = acabNorm(x.acab);
  // andares: projetos antigos não têm térreo desenhado e estavam editando a laje
  x.nivel = x.nivel === 'terreo' ? 'terreo' : 'laje';
  x.outro = x.outro && typeof x.outro === 'object' ? x.outro : {};
  ['walls', 'ops', 'furn'].forEach(k => { if (!Array.isArray(x.outro[k])) x.outro[k] = []; });
  x.next = Math.max(x.next, 200);
  x.ops.concat(x.outro.ops).forEach(o => { if (!o.h) o.h = o.type === 'door' ? 2.1 : 1.0; if (o.type === 'window' && o.sill === undefined) o.sill = 1.1; });
  return x;
}
function modelo() {
  return {
    laje: { w: 5, h: 7.5 },
    walls: [
      { id: 1, x1: 0, y1: 0, x2: 4, y2: 0, t: 0.15 },
      { id: 2, x1: 4, y1: 0, x2: 4, y2: 6, t: 0.15 },
      { id: 3, x1: 4, y1: 6, x2: 0, y2: 6, t: 0.15 },
      { id: 4, x1: 0, y1: 6, x2: 0, y2: 0, t: 0.15 }
    ],
    ops: [
      { id: 5, type: 'door', wall: 3, pos: 2, w: 0.8, h: 2.1, side: 1, hinge: false },
      { id: 6, type: 'window', wall: 2, pos: 3, w: 1.2, h: 1.0, sill: 1.1 }
    ],
    stairs: [],
    next: 7,
    dims: true,
    wallH: 2.8,
    lajeH: 2.8,
    showDown: true,
    furn: furnDef(),
    varanda: { on: true, d: 1.5, gc: true, gcH: 1.0 },
    roof: { on: true, plat: 0.9, caim: 10, dir: 'frente' },
    mat: matDef(),
    fundo: fundoDef(),
    acab: acabDef(),
    nivel: 'laje',
    outro: { walls: [], ops: [], furn: [] }
  };
}

let S;
try { const j = localStorage.getItem(KEY); S = j ? JSON.parse(j) : modelo(); } catch (e) { S = modelo(); }
if (!S || !S.walls) S = modelo();
norm(S);

let sel = null, mode = 'select', drag = null, preview = null;
let calib = null; // pontos marcados ao medir a escala da imagem de fundo: { a: [x, y], b: [x, y] }
const BG = KEY + '-fundo';
let fundo = null; // imagem de fundo guardada neste aparelho: { id, url } (url curta do tipo blob:, para desenhar rápido)
function fundoCarrega() {
  try {
    const j = JSON.parse(localStorage.getItem(BG) || 'null'); if (!j || !j.data) return;
    const bin = atob(j.data.split(',')[1]), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    fundo = { id: j.id, url: URL.createObjectURL(new Blob([arr], { type: 'image/jpeg' })) };
  } catch (e) { fundo = null; }
}
fundoCarrega();
const temFundo = () => !!(fundo && S.fundo.id && fundo.id === S.fundo.id);
let undoSt = [], redoSt = [];
const view = { x: -1.5, y: -1.5, s: 60 };

/* ---------- backups ---------- */
const BK = KEY + '-backups';
let backups = [];
try { backups = JSON.parse(localStorage.getItem(BK) || '[]'); if (!Array.isArray(backups)) backups = []; } catch (e) { backups = []; }
try { const old = localStorage.getItem(KEY + '-backup'); if (old) { backups.push({ t: Date.now() - 1, nome: 'Antes de carregar da nuvem', json: old }); localStorage.removeItem(KEY + '-backup'); } } catch (e) {}
function trimBackups() {
  const seen = new Set();
  backups = backups.filter(b => { const k = b && b.t + '|' + b.nome; return b && b.json && !seen.has(k) && seen.add(k); }).sort((a, b) => b.t - a.t);
  const autos = backups.filter(b => b.auto).slice(0, 12), others = backups.filter(b => !b.auto).slice(0, 15);
  backups = autos.concat(others).sort((a, b) => b.t - a.t);
}
function saveBackups() {
  trimBackups();
  try { localStorage.setItem(BK, JSON.stringify(backups)); }
  catch (e) { backups = backups.slice(0, 8); try { localStorage.setItem(BK, JSON.stringify(backups)); } catch (e2) {} }
}
function addBackup(nome, auto) { backups.unshift({ t: Date.now(), nome, auto: !!auto, json: JSON.stringify(S) }); saveBackups(); }
function autoBackup() {
  const last = backups.filter(b => b.auto)[0];
  if (!last || Date.now() - last.t > 10 * 60 * 1000) addBackup('Automático', true);
}
// Salva o projeto no navegador deste aparelho (localStorage). É chamado a cada alteração.
// S._t guarda a hora do último salvamento (fica no arquivo exportado; hoje é só informativo).
const SALVO = '💾 Salvo neste aparelho';
const save = () => {
  S._t = Date.now();
  autoBackup();
  gravar();
};
// Grava o projeto e mostra o aviso verdadeiro. A prioridade é o projeto: se o espaço acabar,
// apaga os backups mais antigos (ficam os 3 mais novos) e tenta de novo, avisando na tela.
// Se ainda assim não couber, o aviso diz claramente que NÃO está salvando.
let erroSalvar = false;
function gravar() {
  const j = JSON.stringify(S);
  let falha = null;
  const tenta = () => { try { localStorage.setItem(KEY, j); return true; } catch (e) { falha = e; return false; } };
  let ok = tenta(), cortou = false;
  // Só apaga backups se o erro for mesmo de espaço cheio (QuotaExceededError). Se o navegador recusar por
  // outro motivo (armazenamento bloqueado), apagar backups não ajudaria e só perderia dados.
  const cheio = falha && (falha.name === 'QuotaExceededError' || falha.code === 22 || falha.code === 1014 || falha.name === 'NS_ERROR_DOM_QUOTA_REACHED');
  if (!ok && cheio && backups.length > 3) {
    const menos = backups.slice(0, 3);
    try { localStorage.setItem(BK, JSON.stringify(menos)); backups = menos; ok = tenta(); cortou = ok; } catch (e) {}
  }
  if (ok) {
    if (!stAviso) setCs(SALVO);
    if (cortou) alerta('⚠️ O espaço do aparelho acabou: apaguei os backups mais antigos para conseguir salvar o projeto. Use ☰ Mais → Exportar projeto para guardar uma cópia.', '#b54708');
    else if (erroSalvar) alerta('');
    erroSalvar = false;
  } else {
    erroSalvar = true;
    setCs('⚠️ NÃO SALVO — espaço do aparelho cheio', '#b42318');
    alerta('⚠️ O projeto não está sendo salvo neste aparelho. ' + (temFundo() ? 'Remova a imagem de fundo (☰ Mais → Imagem de fundo) para liberar espaço, ou ' : 'Para não perder o trabalho, ') + 'use ☰ Mais → Exportar projeto.');
  }
  return ok;
}
// Faixa de aviso por cima do desenho. Texto vazio esconde. Tocar nela fecha.
function alerta(t, cor) {
  const a = document.getElementById('alerta'); if (!a) return;
  a.textContent = t || ''; a.style.display = t ? 'block' : 'none'; a.style.background = cor || '#b42318';
}
// Mostra o aviso de salvamento no topo (no celular, dentro do menu "Mais").
let stAviso = false; // true quando o aviso de "nova versão" está na tela: ele não é apagado pelo salvamento
function setCs(t, c) { const el = document.getElementById('saveSt'); if (el) { el.textContent = t; el.style.color = c || '#555'; } }
const fmt = v => (Math.round(v * 100) / 100).toFixed(2).replace('.', ',');
const num = s => parseFloat(String(s).replace(',', '.'));
const snap = v => Math.round(v / 0.05) * 0.05;
const same = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by) < 0.001;
const W = id => S.walls.find(w => w.id === id);
const O = id => S.ops.find(o => o.id === id);
const ST = id => S.stairs.find(s => s.id === id);
const FU = id => S.furn.find(f => f.id === id);

function push() { undoSt.push(JSON.stringify(S)); if (undoSt.length > 150) undoSt.shift(); redoSt = []; }
function undo() { if (!undoSt.length) return; redoSt.push(JSON.stringify(S)); S = JSON.parse(undoSt.pop()); sel = null; done(); }
function redo() { if (!redoSt.length) return; undoSt.push(JSON.stringify(S)); S = JSON.parse(redoSt.pop()); sel = null; done(); }
function done() { fixOps(); save(); render(); renderPanel(); }

function G(w) {
  const dx = w.x2 - w.x1, dy = w.y2 - w.y1, L = Math.hypot(dx, dy) || 1e-9, ux = dx / L, uy = dy / L;
  return { L, ux, uy, nx: -uy, ny: ux };
}
function P(w, g, a, off) { off = off || 0; return [w.x1 + g.ux * a + g.nx * off, w.y1 + g.uy * a + g.ny * off]; }
const pt = p => p[0].toFixed(4) + ',' + p[1].toFixed(4);

/* ---------- andares ---------- */
// O projeto tem dois andares: 'laje' (o de cima, que está sendo construído) e 'terreo' (a casa de baixo).
// O andar que está sendo editado fica em S.walls, S.ops e S.furn: assim o editor inteiro continua igual,
// sem precisar saber que existem dois andares. O outro andar fica guardado em S.outro, e S.nivel diz
// qual andar está em S.walls agora. As escadas (S.stairs) ligam os dois andares e ficam fora da troca.
const LAJE_E = 0.12; // espessura da laje (m)
function trocaDados() { const o = S.outro; S.outro = { walls: S.walls, ops: S.ops, furn: S.furn }; S.walls = o.walls; S.ops = o.ops; S.furn = o.furn; }
function andar(n) { return n === S.nivel ? { walls: S.walls, ops: S.ops, furn: S.furn } : S.outro; }
// Roda fn com a laje em S.walls (para o cálculo de materiais, o guarda-corpo etc.) e depois desfaz a troca.
// S.nivel também muda durante a troca: senão quem chamou naLaje (ex.: calcMat) achava que ainda estava no térreo
// e chamava naLaje de novo, sem fim. "finally" garante que tudo volta como estava, mesmo se fn der erro.
function naLaje(fn) { if (S.nivel === 'laje') return fn(); trocaDados(); S.nivel = 'laje'; try { return fn(); } finally { S.nivel = 'terreo'; trocaDados(); } }
function trocaAndar(n) { if (n === S.nivel) return; push(); trocaDados(); S.nivel = n; sel = null; preview = null; drag = null; done(); }
// Altura padrão das paredes: na laje é o pé-direito; no térreo vai do chão até a laje, menos a espessura dela.
function hPad(n) { return (n || S.nivel) === 'terreo' ? Math.max(0.5, S.lajeH - LAJE_E) : S.wallH; }

function fixOps() {
  S.ops = S.ops.filter(o => W(o.wall));
  S.ops.forEach(o => {
    const L = G(W(o.wall)).L;
    if (o.w > L) o.w = Math.max(0.3, snap(L - 0.1));
    o.pos = Math.min(Math.max(o.pos, o.w / 2), L - o.w / 2);
    if (L < o.w) o.pos = L / 2;
  });
}

/* ---------- guarda-corpo ---------- */
function guardSegs() {
  if (S.nivel !== 'laje') return naLaje(guardSegs); // o guarda-corpo é da laje
  const L = S.laje, out = [];
  const edges = [
    { ax: 'x', c: 0, fixed: 'y', len: L.w, p: t => [t, 0] },
    { ax: 'x', c: L.h, fixed: 'y', len: L.w, p: t => [t, L.h] },
    { ax: 'y', c: 0, fixed: 'x', len: L.h, p: t => [0, t] },
    { ax: 'y', c: L.w, fixed: 'x', len: L.h, p: t => [L.w, t] }
  ];
  edges.forEach(e => {
    const cut = [];
    const along = (x, y) => e.ax === 'x' ? x : y, off = (x, y) => Math.abs((e.fixed === 'y' ? y : x) - e.c);
    S.walls.forEach(w => { if (off(w.x1, w.y1) < 0.12 && off(w.x2, w.y2) < 0.12) { const a = along(w.x1, w.y1), b = along(w.x2, w.y2); cut.push([Math.min(a, b) - w.t / 2, Math.max(a, b) + w.t / 2]); } });
    S.stairs.forEach(s => { const r = s.rot * Math.PI / 180, hl = s.l / 2, tx = s.x + hl * Math.sin(r), ty = s.y - hl * Math.cos(r); if (off(tx, ty) < 0.8) { const a = along(tx, ty); cut.push([a - s.w / 2 - 0.05, a + s.w / 2 + 0.05]); } });
    cut.sort((a, b) => a[0] - b[0]);
    let cur = 0;
    cut.forEach(([a, b]) => { if (a > cur + 0.05) out.push([e.p(cur), e.p(Math.min(a, e.len))]); cur = Math.max(cur, b); });
    if (cur < e.len - 0.05) out.push([e.p(cur), e.p(e.len)]);
  });
  return out.filter(([a, b]) => Math.hypot(b[0] - a[0], b[1] - a[1]) > 0.05);
}

/* ---------- desenho ---------- */
function build(exp) {
  const px = exp ? 0.01 : 1 / view.s;
  const fs = exp ? 0.2 : 13 * px;
  let h = '';
  const L = S.laje;
  if (!exp) {
    const r = wrap.getBoundingClientRect(), vw = r.width / view.s, vh = r.height / view.s;
    let g = '';
    for (let x = Math.floor(view.x * 2) / 2; x < view.x + vw; x += 0.5) {
      const major = Math.abs(x - Math.round(x)) < 0.01;
      g += `<line x1="${x}" y1="${view.y}" x2="${x}" y2="${view.y + vh}" stroke="${major ? '#e3e1da' : '#f0efea'}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    }
    for (let y = Math.floor(view.y * 2) / 2; y < view.y + vh; y += 0.5) {
      const major = Math.abs(y - Math.round(y)) < 0.01;
      g += `<line x1="${view.x}" y1="${y}" x2="${view.x + vw}" y2="${y}" stroke="${major ? '#e3e1da' : '#f0efea'}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    }
    h += g;
  }
  // laje
  const naLajeAgora = S.nivel === 'laje';
  h += `<rect x="0" y="0" width="${L.w}" height="${L.h}" fill="${naLajeAgora ? '#fbefd9' : 'none'}" stroke="#b07a2a" stroke-width="${1.5 * px}" stroke-dasharray="${8 * px} ${5 * px}"/>`;
  h += `<text x="${L.w / 2}" y="${-fs * 2.6}" font-size="${fs}" text-anchor="middle" fill="#8a5a14">Laje ${fmt(L.w)} m</text>`;
  h += `<text x="${-fs * 2.6}" y="${L.h / 2}" font-size="${fs}" text-anchor="middle" fill="#8a5a14" transform="rotate(-90 ${-fs * 2.6} ${L.h / 2})">Laje ${fmt(L.h)} m</text>`;

  // varanda
  if (S.varanda.on && naLajeAgora) {
    const vd = Math.min(S.varanda.d, L.h);
    h += `<rect x="0" y="${L.h - vd}" width="${L.w}" height="${vd}" fill="#e3eed6" stroke="none"/>`;
    h += `<text x="${L.w / 2}" y="${L.h - vd / 2}" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#4a6a2a">Varanda (${fmt(vd)} m)</text>`;
  }
  if (S.varanda.gc && naLajeAgora) guardSegs().forEach(([a, b]) => { h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#6b6b6b" stroke-width="0.05" stroke-dasharray="0.12 0.06"/>`; });

  // imagem de fundo: só na tela (não entra no PNG). Fica por cima da laje e da varanda (que são opacas e a
  // esconderiam) e por baixo das paredes e do resto. pointer-events="none": o clique passa por ela.
  if (!exp && S.fundo.on && temFundo()) { const F = S.fundo; h += `<image href="${fundo.url}" x="${F.x}" y="${F.y}" width="${F.w}" height="${F.w * F.ar}" opacity="${F.op}" preserveAspectRatio="none" pointer-events="none"/>`; }
  // paredes do outro andar, em cinza claro, só para referência (não recebem clique e não vão para o PNG).
  // Na laje, mostram onde estão as paredes de baixo (é sobre elas que as de cima costumam apoiar).
  if (!exp) S.outro.walls.forEach(w => {
    const g = G(w), t = w.t;
    h += `<polygon points="${pt(P(w, g, -t / 2, t / 2))} ${pt(P(w, g, g.L + t / 2, t / 2))} ${pt(P(w, g, g.L + t / 2, -t / 2))} ${pt(P(w, g, -t / 2, -t / 2))}" fill="#8a96a6" fill-opacity="0.35" pointer-events="none"/>`;
  });
  // paredes
  S.walls.forEach(w => {
    const g = G(w), t = w.t, on = !exp && sel && sel.k === 'w' && sel.id === w.id;
    const iv = S.ops.filter(o => o.wall === w.id).map(o => [o.pos - o.w / 2, o.pos + o.w / 2]).sort((a, b) => a[0] - b[0]);
    const segs = []; let cur = 0;
    iv.forEach(([a, b]) => { if (a > cur) segs.push([cur, a]); cur = Math.max(cur, b); });
    if (cur < g.L) segs.push([cur, g.L]);
    segs.forEach(([a, b]) => {
      const ea = a <= 1e-4 ? -t / 2 : a, eb = b >= g.L - 1e-4 ? g.L + t / 2 : b;
      h += `<polygon points="${pt(P(w, g, ea, t / 2))} ${pt(P(w, g, eb, t / 2))} ${pt(P(w, g, eb, -t / 2))} ${pt(P(w, g, ea, -t / 2))}" fill="${on ? '#1d4ed8' : '#2b2b2b'}"/>`;
    });
  });

  // portas e janelas
  S.ops.forEach(o => {
    const w = W(o.wall); if (!w) return;
    const g = G(w), on = !exp && sel && sel.k === 'o' && sel.id === o.id, col = on ? '#1d4ed8' : '#333';
    let a = o.pos - o.w / 2, b = o.pos + o.w / 2;
    if (o.type === 'door') {
      if (o.hinge) [a, b] = [b, a];
      const s = o.side || 1, A = P(w, g, a), B = P(w, g, b), C = P(w, g, a, s * o.w);
      const cr = (C[0] - A[0]) * (B[1] - A[1]) - (C[1] - A[1]) * (B[0] - A[0]);
      h += `<line x1="${A[0]}" y1="${A[1]}" x2="${C[0]}" y2="${C[1]}" stroke="${col}" stroke-width="${2.2 * px}"/>`;
      h += `<path d="M${pt(C)} A${o.w} ${o.w} 0 0 ${cr > 0 ? 1 : 0} ${pt(B)}" fill="none" stroke="${col}" stroke-width="${1 * px}" stroke-dasharray="${4 * px} ${3 * px}"/>`;
    } else {
      const t = w.t;
      h += `<polygon points="${pt(P(w, g, a, t / 2))} ${pt(P(w, g, b, t / 2))} ${pt(P(w, g, b, -t / 2))} ${pt(P(w, g, a, -t / 2))}" fill="#fff" stroke="${col}" stroke-width="${1.2 * px}"/>`;
      h += `<line x1="${P(w, g, a)[0]}" y1="${P(w, g, a)[1]}" x2="${P(w, g, b)[0]}" y2="${P(w, g, b)[1]}" stroke="${col}" stroke-width="${1.2 * px}"/>`;
    }
  });

  // móveis
  S.furn.forEach(f => {
    const on = !exp && sel && sel.k === 'f' && sel.id === f.id, c = on ? '#1d4ed8' : '#5b5b5b', hw = f.w / 2, hd = f.d / 2, sw = 1.1 * px;
    const R = (x, y, w, hh, fill, rx) => `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="${rx || 0}" fill="${fill || '#fff'}" stroke="${c}" stroke-width="${sw}"/>`;
    let g = `<g transform="translate(${f.x} ${f.y}) rotate(${f.rot})" pointer-events="none">`;
    if (f.type === 'mesa') { g += R(-hw, -hd, f.w, f.d, '#f3e6d3') + R(-0.3, -hd + 0.06, 0.6, 0.05, '#333') + R(-0.22, -0.02, 0.44, 0.13, '#ddd') + R(hw - 0.25, -hd + 0.08, 0.2, 0.42, '#bbb'); }
    else if (f.type === 'cadeira') { g += R(-hw + 0.06, -hd + 0.12, f.w - 0.12, f.d - 0.16, '#e6e6e6', 0.06) + R(-hw + 0.08, -hd, f.w - 0.16, 0.1, '#999', 0.03); }
    else if (f.type === 'sofa') { g += R(-hw, -hd, f.w, f.d, '#dfe5ec', 0.05) + R(-hw, -hd, f.w, 0.2, '#b9c4d1') + R(-hw, -hd, 0.18, f.d, '#b9c4d1') + R(hw - 0.18, -hd, 0.18, f.d, '#b9c4d1') + `<line x1="0" y1="${-hd + 0.2}" x2="0" y2="${hd}" stroke="${c}" stroke-width="${sw}"/>`; }
    else if (f.type === 'tv') { g += R(-hw, -hd, f.w, f.d, '#ead9c4') + R(-Math.min(0.62, hw - 0.05), -hd + 0.05, Math.min(1.24, f.w - 0.1), 0.06, '#222'); }
    else if (f.type === 'estante') { g += R(-hw, -hd, f.w, f.d, '#ead9c4'); for (let i = 1; i < 4; i++) g += `<line x1="${-hw + i * f.w / 4}" y1="${-hd}" x2="${-hw + i * f.w / 4}" y2="${hd}" stroke="${c}" stroke-width="${sw * 0.7}"/>`; }
    else if (f.type === 'planta') { const r = Math.min(hw, hd); g += `<circle r="${r}" fill="#cfe6c0" stroke="${c}" stroke-width="${sw}"/><circle r="${r * 0.45}" fill="#8fbf74" stroke="none"/>`; }
    if (f.type !== 'planta' && f.type !== 'cadeira') g += `<text x="0" y="${hd * 0.45}" font-size="${fs * 0.75}" text-anchor="middle" dominant-baseline="central" fill="${c}">${FURN[f.type].nome}</text>`;
    h += g + '</g>';
  });

  // escadas
  S.stairs.forEach(s => {
    const on = !exp && sel && sel.k === 's' && sel.id === s.id, col = on ? '#1d4ed8' : '#333', hl = s.l / 2, hw = s.w / 2;
    h += `<g transform="translate(${s.x} ${s.y}) rotate(${s.rot})">`;
    h += `<rect x="${-hw}" y="${-hl}" width="${s.w}" height="${s.l}" fill="#fff" stroke="${col}" stroke-width="${1.6 * px}"/>`; // a área de clique da escada fica mais abaixo
    for (let i = 1; i < s.n; i++) { const y = -hl + i * s.l / s.n; h += `<line x1="${-hw}" y1="${y}" x2="${hw}" y2="${y}" stroke="${col}" stroke-width="${0.8 * px}" pointer-events="none"/>`; }
    const ah = Math.min(0.25, s.w * 0.3);
    h += `<circle cx="0" cy="${hl - 0.15}" r="${Math.min(0.06, s.w * 0.08)}" fill="${col}" pointer-events="none"/>`;
    h += `<line x1="0" y1="${hl - 0.15}" x2="0" y2="${-hl + ah}" stroke="${col}" stroke-width="${1.4 * px}" pointer-events="none"/>`;
    h += `<polygon points="0,${-hl + 0.05} ${-ah / 2},${-hl + ah + 0.05} ${ah / 2},${-hl + ah + 0.05}" fill="${col}" pointer-events="none"/>`;
    h += `<text x="0" y="${hl + fs * 1.1}" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="${col}" pointer-events="none">SOBE</text>`;
    h += `</g>`;
  });

  // cotas
  if (S.dims) {
    S.walls.forEach(w => {
      const g = G(w), m = P(w, g, g.L / 2, -(w.t / 2 + fs * 0.9));
      let ang = Math.atan2(g.uy, g.ux) * 180 / Math.PI;
      if (ang >= 89.9) ang -= 180; if (ang < -90.1) ang += 180;
      h += `<text x="${m[0]}" y="${m[1]}" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#555" transform="rotate(${ang} ${m[0]} ${m[1]})">${fmt(g.L)}</text>`;
    });
  }

  if (!exp && mode === 'calib' && calib) {
    // pontos marcados para medir a escala da imagem de fundo
    const pts = [calib.a, calib.b].filter(Boolean);
    if (pts.length === 2) h += `<line x1="${pts[0][0]}" y1="${pts[0][1]}" x2="${pts[1][0]}" y2="${pts[1][1]}" stroke="#d92d20" stroke-width="${2 * px}"/>`;
    pts.forEach(q => { h += `<circle cx="${q[0]}" cy="${q[1]}" r="${6 * px}" fill="none" stroke="#d92d20" stroke-width="${2 * px}"/><circle cx="${q[0]}" cy="${q[1]}" r="${1.5 * px}" fill="#d92d20"/>`; });
  }
  if (!exp) {
    // áreas de clique
    S.walls.forEach(w => {
      h += `<line data-k="w" data-id="${w.id}" x1="${w.x1}" y1="${w.y1}" x2="${w.x2}" y2="${w.y2}" stroke="transparent" stroke-width="${Math.max(w.t, 16 * px)}" style="cursor:pointer"/>`;
    });
    // Escadas: no SVG, o que é desenhado depois fica por cima e recebe o clique. Por isso a área de clique
    // da escada vem depois da área das paredes; assim, onde a escada cobre uma parede, o clique pega a escada.
    // Só no modo Selecionar: nos modos Porta e Janela o clique precisa achar a parede que está embaixo.
    // Portas, janelas e móveis vêm depois e continuam clicáveis mesmo em cima de uma escada.
    if (mode === 'select') S.stairs.forEach(s => {
      h += `<g transform="translate(${s.x} ${s.y}) rotate(${s.rot})"><rect data-k="s" data-id="${s.id}" x="${-s.w / 2}" y="${-s.l / 2}" width="${s.w}" height="${s.l}" fill="transparent" style="cursor:grab"/></g>`;
    });
    S.ops.forEach(o => {
      const w = W(o.wall); if (!w) return; const g = G(w);
      const A = P(w, g, o.pos - o.w / 2), B = P(w, g, o.pos + o.w / 2);
      h += `<line data-k="o" data-id="${o.id}" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="transparent" stroke-width="${20 * px}" style="cursor:grab"/>`;
    });
    S.furn.forEach(f => {
      h += `<g transform="translate(${f.x} ${f.y}) rotate(${f.rot})"><rect data-k="f" data-id="${f.id}" x="${-f.w / 2}" y="${-f.d / 2}" width="${f.w}" height="${f.d}" fill="transparent" style="cursor:grab"/></g>`;
    });
    if (sel && sel.k === 'w' && W(sel.id)) {
      const w = W(sel.id);
      [[w.x1, w.y1, 1], [w.x2, w.y2, 2]].forEach(([x, y, e]) => {
        h += `<circle data-k="h" data-id="${w.id}" data-e="${e}" cx="${x}" cy="${y}" r="${8 * px}" fill="#fff" stroke="#1d4ed8" stroke-width="${2 * px}" style="cursor:move"/>`;
      });
    }
    if (preview) {
      const [a, b] = preview, len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#1d4ed8" stroke-opacity=".55" stroke-width="0.15" stroke-linecap="square"/>`;
      h += `<text x="${(a[0] + b[0]) / 2}" y="${(a[1] + b[1]) / 2 - fs}" font-size="${fs}" text-anchor="middle" fill="#1d4ed8">${fmt(len)} m</text>`;
    }
  }
  return h;
}

function render() {
  const r = wrap.getBoundingClientRect();
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${r.width / view.s} ${r.height / view.s}`);
  svg.innerHTML = build(false);
  if (is3d) { build3d(); draw3d(); }
  const hints = {
    select: 'Clique numa parede, porta, janela ou escada para editar. Arraste para mover. Arraste o fundo para navegar.',
    wall: 'Clique e arraste para desenhar uma parede. Ela gruda nas pontas de outras paredes e fica reta sozinha.',
    door: 'Clique em cima de uma parede para colocar uma porta.',
    window: 'Clique em cima de uma parede para colocar uma janela.',
    furn: 'Escolha o móvel na lista e clique no desenho onde ele deve ficar.',
    stair: 'Clique no desenho onde a escada deve ficar. Depois ajuste tamanho, degraus e sentido no painel.',
    bg: 'Arraste para mover a imagem de fundo. Toque em “Pronto” no painel quando terminar.',
    calib: calib && calib.b ? 'Agora digite no painel a distância real entre os dois pontos.' : calib ? 'Toque no segundo ponto da medida que você conhece.' : 'Toque no primeiro ponto de uma medida que você conhece na imagem (por exemplo, a ponta de uma parede).'
  };
  hint.textContent = is3d ? (walk ? HINT_WALK : HINT_3D) : hints[mode];
  const an = document.getElementById('andar');
  an.style.display = is3d ? 'none' : 'flex';
  document.getElementById('bLaje').classList.toggle('on', S.nivel === 'laje');
  document.getElementById('bTerreo').classList.toggle('on', S.nivel === 'terreo');
}
document.getElementById('bLaje').onclick = () => trocaAndar('laje');
document.getElementById('bTerreo').onclick = () => trocaAndar('terreo');

/* ---------- painel ---------- */
function fundoPainel() {
  const F = S.fundo, ok = temFundo();
  let h = `<h3 style="margin-top:18px" id="fundoSec">Imagem de fundo</h3>`;
  if (!ok) {
    h += `<p class="muted">Carregue uma foto ou uma planta antiga para desenhar por cima. Depois ajuste a escala e a transparência.</p>
      ${F.id ? '<p class="muted" style="color:#b54708">Este projeto tinha uma imagem de fundo, mas ela fica só no aparelho onde foi carregada. Carregue de novo se quiser usar.</p>' : ''}
      <div class="row"><button id="bgLoad">🗺 Carregar imagem…</button></div><p id="bgErr" style="color:#b42318;font-size:13px"></p>`;
    return h;
  }
  if (mode === 'calib') {
    h += calib && calib.b
      ? `<div class="sum">Distância marcada: <b>${fmt(Math.hypot(calib.b[0] - calib.a[0], calib.b[1] - calib.a[1]))} m</b> no desenho.</div>
         <label>Distância real entre os dois pontos (m)</label><input id="bgReal" inputmode="decimal" placeholder="ex.: 4,00">
         <div class="row"><button id="bgApl" class="on">Aplicar escala</button><button id="bgCan">Cancelar</button></div><p id="bgErr" style="color:#b42318;font-size:13px"></p>`
      : `<p class="muted"><b>Medir escala:</b> toque no ${calib ? 'segundo' : 'primeiro'} ponto de uma medida que você conhece na imagem (por exemplo, as duas pontas de uma parede cotada).</p><div class="row"><button id="bgCan">Cancelar</button></div>`;
    return h;
  }
  h += `<label><input type="checkbox" id="bgOn" ${F.on ? 'checked' : ''} style="width:auto"> Mostrar imagem de fundo</label>
    <label>Transparência: <b id="bgOpV">${Math.round((1 - F.op) * 100)}%</b> (mais à direita = mais apagada)</label><input type="range" id="bgOp" min="0" max="95" step="5" value="${Math.round((1 - F.op) * 100)}" style="padding:0">
    <label>Largura da imagem (m) — altura ${fmt(F.w * F.ar)} m</label><input id="bgW" inputmode="decimal" value="${fmt(F.w)}">

const FUNDO_MAX = 800000, FUNDO_RESERVA = 600000; // em caracteres do localStorage (o navegador guarda uns 5 milhões)
function fundoArquivo(file) {
  const err = t => { const e = document.getElementById('bgErr'); if (e) e.textContent = t; };
  if (!file) return;
  if (!/^image\//.test(file.type)) return err('Escolha um arquivo de imagem (foto, JPG ou PNG). PDF não é aceito: tire um print da planta.');
  const img = new Image(), src = URL.createObjectURL(file);
  img.onerror = () => { URL.revokeObjectURL(src); err('Não consegui abrir essa imagem.'); };
  img.onload = () => {
    URL.revokeObjectURL(src);

    // Regras de espaço:
    // - a imagem guardada não passa de FUNDO_MAX caracteres (~800 KB); se passar, tenta menor;
    // - depois de guardar, ainda precisa sobrar FUNDO_RESERVA livre, para o projeto e os backups continuarem salvando;
    // - se não couber, a imagem anterior (se houver) volta para o lugar e nada muda no projeto.
    let antiga = null; try { antiga = localStorage.getItem(BG); } catch (e) {}
    const devolve = () => { try { if (antiga) localStorage.setItem(BG, antiga); else localStorage.removeItem(BG); } catch (e) { try { localStorage.removeItem(BG); } catch (e2) {} } };
    let data = null;

      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/jpeg', q);
      if (d.length > FUNDO_MAX) continue;
      try { localStorage.setItem(BG, JSON.stringify({ id, data: d })); } catch (e) { devolve(); continue; }
      try { localStorage.setItem(KEY + '-reserva', 'x'.repeat(FUNDO_RESERVA)); localStorage.removeItem(KEY + '-reserva'); data = d; break; }
      catch (e) { try { localStorage.removeItem(KEY + '-reserva'); } catch (e2) {} devolve(); }
    }

      const t = 'A imagem não coube no espaço deste aparelho sem atrapalhar o salvamento do projeto, por isso não foi carregada' +
        (antiga && temFundo() ? ' (a imagem anterior continua)' : '') + '. O projeto continua salvando. Para liberar espaço, apague backups antigos (☰ Mais → Backups) ou use uma imagem menor.';
      err(t); alerta('⚠️ ' + t, '#b54708'); return;
    }

const BLOCOS = {
  '9x19x19': ['Tijolo/lajota cerâmica 8 furos 9x19x19', 19, 19, 9],
  '9x14x19': ['Tijolo cerâmico 6 furos 9x14x19', 19, 14, 9],
  '9x19x29': ['Bloco cerâmico 9x19x29', 29, 19, 9],
  '14x19x39': ['Bloco de concreto 14x19x39', 39, 19, 14],
  'outro': ['Outro (digitar medidas)', 0, 0, 0]
};
function calcMat() {
  if (S.nivel !== 'laje') return naLaje(calcMat); // materiais: só as paredes da laje (a obra); o térreo já existe
  const m = S.mat; let bruto = 0, abert = 0;
  const lin = S.walls.map((w, i) => { const H = (w.hgt || S.wallH) + (S.roof.on ? S.roof.plat : 0), L = G(w).L; bruto += L * H; return { i: i + 1, L, H }; });
  S.ops.forEach(o => { const w = W(o.wall); if (!w) return; const H = w.hgt || S.wallH; const top = o.type === 'door' ? Math.min(o.h, H) : Math.max(0, Math.min(o.sill + o.h, H) - Math.min(o.sill, H)); abert += o.w * top; });
  const liq = Math.max(0, bruto - abert);
  const face = (m.bw + m.j) / 100 * (m.bh + m.j) / 100, porM2 = face > 0 ? 1 / face : 0;
  const tij = Math.ceil(liq * porM2 * (1 + m.perda / 100));
  const vAss = liq * Math.max(0, 1 - porM2 * (m.bw / 100) * (m.bh / 100)) * (m.bt / 100) * (1 + m.perdaArg / 100);
  const vReb = m.reboco ? liq * m.faces * (m.rebEsp / 100) * (1 + m.perdaArg / 100) : 0;
  const seco = 1.3;
  const cim = (v, tr) => v * seco / (1 + tr) * 1400, are = (v, tr) => v * seco * tr / (1 + tr);
  const cimKg = cim(vAss, m.trAss) + cim(vReb, m.trReb), areia = are(vAss, m.trAss) + are(vReb, m.trReb);
  return { lin, bruto, abert, liq, porM2, tij, vAss, vReb, cimKg, sacos: Math.ceil(cimKg / 50), areia, latas: Math.ceil(areia / 0.018) };
}
const f1 = v => v.toFixed(1).replace('.', ','), f2 = v => v.toFixed(2).replace('.', ',');

const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const brn = v => v.toLocaleString('pt-BR');
// Lê um preço digitado: aceita "38,90", "R$ 38,90", "1.200" (mil e duzentos) e "1.200,50". Vazio = 0.
function preco(t) {
  t = String(t).replace(/R\$|\s/g, '');
  if (t === '') return 0;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');

      if (bt.dataset.ok !== '1') { bt.dataset.ok = '1'; bt.textContent = 'Confirmar restauração'; bt.classList.add('on'); return; }
      const b = backups[+bt.dataset.r];
      try { const j = norm(JSON.parse(b.json)); addBackup('Antes de restaurar backup'); push(); S = j; sel = null; done(); fit(); modal.style.display = 'none'; }
      catch (e) { bt.textContent = 'Backup inválido'; }
    });
    el.querySelectorAll('[data-d]').forEach(bt => bt.onclick = () => {
      if (bt.dataset.ok !== '1') { bt.dataset.ok = '1'; bt.textContent = 'Confirmar exclusão'; return; }
      backups.splice(+bt.dataset.d, 1); saveBackups(); list();
    });
  };
  document.getElementById('bkAdd').onclick = () => { const n = document.getElementById('bkN').value.trim(); addBackup(n || 'Backup manual'); document.getElementById('bkN').value = ''; list(); };
  list();
}
document.getElementById('bBk').onclick = openBackups;

window.addEventListener('resize', render);
(function () {
  const sp = document.getElementById('splash'); if (!sp) return;
  let gone = false;
  const hide = () => { if (gone) return; gone = true; sp.classList.add('hide'); setTimeout(() => sp.remove(), 500); };
  window.addEventListener('load', () => setTimeout(hide, Math.max(0, 1000 - performance.now())));
  setTimeout(hide, 4000);
})();

fixOps(); renderPanel(); requestAnimationFrame(fit);
document.getElementById('alerta').onclick = () => alerta('');
gravar(); // ao abrir, grava de verdade: assim o aviso só diz "Salvo" se o navegador aceitou salvar
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded || !hadController) return;
    stAviso = true; setCs('🔄 Nova versão instalada — toque aqui para recarregar', '#1d4ed8');
    document.getElementById('bMore').classList.add('on'); // no celular o aviso fica dentro do menu "Mais": destaca o botão
    const el = document.getElementById('saveSt'); el.style.cursor = 'pointer';
    el.onclick = () => { reloaded = true; location.reload(); };
  });
}
</script>
